name: Publish game mod

on:
  push:
    branches: [main]
    paths: [release/mod.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-mod-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact release commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Build and verify the validated artifacts
        run: python3 scripts/release_mod.py prepare
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_mod.py publish
